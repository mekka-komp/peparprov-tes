<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin Medali Peparprov</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#141a24;--mu:#667085;--bd:#e3e7ee;--ac:#1d4ed8;--hl:#eef3ff;--warn:#b54708}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#171e28;--tx:#e8ecf2;--mu:#98a2b3;--bd:#2a3340;--ac:#6b9bff;--hl:#1b2638;--warn:#fdb022}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.w{max-width:720px;margin:0 auto}
h1{font-size:1.3rem;margin:4px 0 6px}
.mu{color:var(--mu);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-top:14px;overflow-x:auto}
.bar{padding:12px;display:grid;gap:8px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:.8rem;color:var(--mu);background:var(--bg)}
td.n,th.n{text-align:left;white-space:normal;width:100%}
td.r{font-weight:700;color:var(--ac)}
tr:last-child td{border-bottom:0}
.ad{display:flex;align-items:center;justify-content:center;gap:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;min-width:32px;height:32px}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);padding:0 14px;height:38px}
button.x{color:#c0392b}
input,textarea{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pin{position:sticky;top:0;z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-top:14px}
.dirty{color:var(--warn);font-weight:600}
.ok{color:var(--ac)}
.err{color:#c0392b}
.hid{display:none}
</style></head>
<body><div class="w">
<h1>Admin Medali Peparprov</h1>
<div class="mu">Halaman ini hanya bisa menyimpan jika token GitHub terisi. Pengunjung biasa tidak bisa mengubah apa pun.</div>

<div class="card bar" id="cfg">
  <b>Pengaturan GitHub</b>
  <input id="repo" placeholder="pemilik/nama-repo, mis. mekka/medali">
  <input id="branch" placeholder="Branch (default: main)">
  <input id="token" type="password" placeholder="Personal access token (fine-grained, Contents: Read and write)" autocomplete="off">
  <div class="row"><button class="p" id="load">Simpan pengaturan &amp; muat data</button></div>
  <div class="mu">Token hanya disimpan di browser perangkat ini. Jangan dipakai di perangkat bersama.</div>
</div>

<div id="app" class="hid">
  <div class="pin row"><button class="p" id="save">Simpan ke GitHub</button><span id="msg" class="mu"></span></div>
  <div class="card bar"><b>Judul</b><input id="ttl"></div>
  <div class="card"><table><thead><tr><th>#</th><th class="n">Kontingen</th><th>🥇</th><th>🥈</th><th>🥉</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
  <div class="card bar"><b>Tambah kontingen</b>
    <textarea id="bulk" rows="3" placeholder="Satu nama per baris"></textarea>
    <div class="row"><button class="p" id="add">Tambah</button></div></div>
</div>
</div>
<script>
const $=s=>document.querySelector(s);
const LS={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={t:'Klasemen Perolehan Medali Peparprov',u:'',k:[]},sha=null,dirty=false;
const guess=location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]+'/'+(location.pathname.split('/')[1]||''):'';
$('#repo').value=LS.get('pm_repo')||guess;
$('#branch').value=LS.get('pm_branch')||'main';
$('#token').value=LS.get('pm_token');

const api=()=>{const r=$('#repo').value.trim(),b=$('#branch').value.trim()||'main';return{url:'https://api.github.com/repos/'+r+'/contents/medali.json',b}};
const hdr=()=>({'Authorization':'Bearer '+$('#token').value.trim(),'Accept':'application/vnd.github+json'});
function msg(t,c){const m=$('#msg');m.textContent=t;m.className=c||'mu'}
function mark(d){dirty=d;msg(d?'Belum disimpan':'Tersimpan',d?'dirty':'ok')}

function rank(){
  const a=S.k.map((k,i)=>({...k,i})).sort((x,y)=>y.g-x.g||y.s-x.s||y.b-x.b||x.n.localeCompare(y.n));
  a.forEach((k,j)=>{k.r=(j&&k.g==a[j-1].g&&k.s==a[j-1].s&&k.b==a[j-1].b)?a[j-1].r:j+1});
  return a;
}
const cell=(k,m)=>'<div class="ad"><button data-i="'+k.i+'" data-m="'+m+'" data-d="-1">−</button><b>'+k[m]+'</b><button data-i="'+k.i+'" data-m="'+m+'" data-d="1">+</button></div>';
function render(){
  $('#ttl').value=S.t;
  $('#tb').innerHTML=rank().map(k=>'<tr><td class="r">'+k.r+'</td><td class="n">'+esc(k.n)+'</td><td>'+cell(k,'g')+'</td><td>'+cell(k,'s')+'</td><td>'+cell(k,'b')+'</td><td><button class="x" data-del="'+k.i+'">✕</button></td></tr>').join('')||'<tr><td colspan="6" class="mu">Belum ada kontingen.</td></tr>';
}

async function load(){
  LS.set('pm_repo',$('#repo').value.trim());LS.set('pm_branch',$('#branch').value.trim()||'main');LS.set('pm_token',$('#token').value.trim());
  const a=api();
  try{
    const r=await fetch(a.url+'?ref='+encodeURIComponent(a.b)+'&t='+Date.now(),{headers:hdr(),cache:'no-store'});
    if(r.status===404){sha=null;}
    else if(!r.ok)throw new Error(r.status===401?'Token ditolak':'Gagal memuat ('+r.status+')');
    else{
      const j=await r.json();sha=j.sha;
      S=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0))));
    }
    $('#app').classList.remove('hid');render();mark(false);msg('Data dimuat','ok');
  }catch(e){alert(e.message||'Gagal memuat data');}
}
async function save(){
  const a=api();msg('Menyimpan…');
  S.u=new Date().toISOString();
  const body={message:'Update medali '+S.u,content:btoa(unescape(encodeURIComponent(JSON.stringify(S,null,1)))),branch:a.b};
  if(sha)body.sha=sha;
  try{
    const r=await fetch(a.url,{method:'PUT',headers:hdr(),body:JSON.stringify(body)});
    if(!r.ok){
      if(r.status===409||r.status===422)throw new Error('Data di GitHub sudah berubah. Muat ulang dulu.');
      throw new Error(r.status===401||r.status===403||r.status===404?'Token tidak punya izin tulis ke repo ini':'Gagal menyimpan ('+r.status+')');
    }
    sha=(await r.json()).content.sha;mark(false);msg('Tersimpan. Halaman publik terbarui dalam ±1 menit.','ok');
  }catch(e){msg(e.message,'err');}
}

$('#load').onclick=load;
$('#save').onclick=save;
$('#ttl').onchange=e=>{S.t=e.target.value.trim()||S.t;mark(true)};
$('#add').onclick=()=>{
  const n=$('#bulk').value.split('\n').map(x=>x.trim()).filter(Boolean);
  n.forEach(x=>{if(!S.k.some(k=>k.n.toLowerCase()===x.toLowerCase()))S.k.push({n:x,g:0,s:0,b:0})});
  if(n.length){$('#bulk').value='';render();mark(true)}
};
$('#tb').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.m){const k=S.k[+b.dataset.i];k[b.dataset.m]=Math.max(0,k[b.dataset.m]+ +b.dataset.d);}
  else if(b.dataset.del){const k=S.k[+b.dataset.del];if(!confirm('Hapus '+k.n+'?'))return;S.k.splice(+b.dataset.del,1);}
  else return;
  render();mark(true);
};
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
if($('#repo').value&&$('#token').value)load();
</script></body></html>
