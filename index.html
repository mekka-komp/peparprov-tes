<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Klasemen Medali Peparprov</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#141a24;--mu:#667085;--bd:#e3e7ee;--ac:#1d4ed8;--hl:#eef3ff}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#171e28;--tx:#e8ecf2;--mu:#98a2b3;--bd:#2a3340;--ac:#6b9bff;--hl:#1b2638}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
.w{max-width:720px;margin:0 auto}
h1{font-size:1.35rem;margin:4px 0 2px}
.mu{color:var(--mu);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-top:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:.8rem;color:var(--mu);font-weight:600;background:var(--bg)}
td.n,th.n{text-align:left;white-space:normal;width:100%}
td.r{font-weight:700;color:var(--ac);width:36px}
td.t{font-weight:700}
tr:last-child td{border-bottom:0}
tr.top td{background:var(--hl)}
</style></head>
<body><div class="w" id="root">Memuat…</div>
<script>
let S=null;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rank(){
  const a=S.k.slice().sort((x,y)=>y.g-x.g||y.s-x.s||y.b-x.b||x.n.localeCompare(y.n));
  a.forEach((k,j)=>{k.r=(j&&k.g==a[j-1].g&&k.s==a[j-1].s&&k.b==a[j-1].b)?a[j-1].r:j+1});
  return a;
}
function render(){
  const a=rank();
  const up=S.u?new Date(S.u).toLocaleString('id-ID',{timeZone:'Asia/Jakarta',dateStyle:'medium',timeStyle:'short'})+' WIB':'';
  let h='<h1>'+esc(S.t)+'</h1><div class="mu">'+(up?'Diperbarui: '+up:'Belum ada pembaruan')+'</div>';
  h+='<div class="card"><table><thead><tr><th>#</th><th class="n">Kontingen</th><th>🥇</th><th>🥈</th><th>🥉</th><th>Total</th></tr></thead><tbody>';
  if(!a.length)h+='<tr><td colspan="6" class="mu">Belum ada data.</td></tr>';
  a.forEach(k=>{h+='<tr'+(k.r==1&&k.g+k.s+k.b>0?' class="top"':'')+'><td class="r">'+k.r+'</td><td class="n">'+esc(k.n)+'</td><td>'+k.g+'</td><td>'+k.s+'</td><td>'+k.b+'</td><td class="t">'+(k.g+k.s+k.b)+'</td></tr>'});
  document.getElementById('root').innerHTML=h+'</tbody></table></div>';
}
async function load(){
  try{
    const r=await fetch('medali.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw 0;
    S=await r.json();render();
  }catch(e){if(!S)document.getElementById('root').textContent='Data belum tersedia.';}
}
load();setInterval(load,30000);
</script></body></html>
